version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - storage_data:/var/www/html/storage
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-BaghdadLib2026!Strong}
      MYSQL_DATABASE: baghdad_library
      MYSQL_USER: baghdad_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-BaghdadLib@SecurePass2026}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  storage_data:
  mysql_data:
